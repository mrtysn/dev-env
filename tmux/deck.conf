# =============================================================================
# DECK — Steam Deck (headless worker, reached over SSH from a Mac running tmux)
# Prefix: Ctrl-b (default, so it differs from the Macs' Ctrl-a / Ctrl-s) | Status: Orange | Indicator: [DECK]
# Install: copy to ~/.tmux.conf on the Deck (SteamOS has no dev-env import).
# =============================================================================

# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
setw -g aggressive-resize on

# --- No bells ---
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# --- Splits ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation (Alt + arrow, no prefix) ---
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Pane resize (prefix + Shift-arrow) ---
bind S-Left resize-pane -L 5
bind S-Right resize-pane -R 5
bind S-Up resize-pane -U 3
bind S-Down resize-pane -D 3

# --- Window navigation ---
bind -n S-Left previous-window
bind -n S-Right next-window

# --- New window in current path ---
bind c new-window -c "#{pane_current_path}"

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- Session switcher ---
bind S choose-tree -s

# --- Copy mode (vi keys); the Deck has no clipboard tool, so copying stays inside tmux ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar: Orange ---
set -g status-position bottom
set -g status-style "bg=colour130,fg=colour255"
set -g status-left-length 30
set -g status-right-length 40
set -g status-left "#[fg=colour255,bg=colour166,bold] [DECK] #S #[fg=colour166,bg=colour130] "
set -g status-right "#[fg=colour255] %H:%M "
set -g status-justify left

# Window status
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour130,bg=colour208]#[fg=colour255,bg=colour208,bold] #I:#W #[fg=colour208,bg=colour130]"

# Pane borders
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour208"

# Message style
set -g message-style "bg=colour208,fg=colour255,bold"
